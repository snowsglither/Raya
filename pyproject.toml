[project]
name = "raya"
version = "0.0.1"
description = "RAYA V2 — runtime agentique headless-first"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",  # Phase 3 : provider Ollama réel (raya/models/providers/ollama_*.py)
    "fastapi>=0.110",  # Phase 6 : Cockpit (raya/runtime/entrypoints/web.py) — API + WebSocket
    "uvicorn>=0.29",   # Phase 6 : serveur ASGI du Cockpit
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]  # httpx : starlette.testclient (tests/runtime/test_web_entrypoint.py)

[project.scripts]
raya = "raya.runtime.entrypoints.cli:main"
raya-web = "raya.runtime.entrypoints.web:main"

[tool.setuptools]
packages = { find = { include = ["raya*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
